<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <title>YouTube Watch Test</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #player {
      width: 200px;
      height: 200px;
      background: #111;
      margin-top: 4px;
    }

    #log {
      width: 190px;
      margin-top: 8px;
      padding: 6px;
      border-radius: 8px;
      background: #222;
      font-size: 11px;
      text-align: left;
      word-break: break-word;
    }

    button {
      margin: 6px;
      padding: 9px 14px;
      border: 0;
      border-radius: 18px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="player"></div>

  <button onclick="manualPlay()">
    ▶ 再生
  </button>

  <div id="log">
    起動中...
  </div>


<script>

const logBox = document.getElementById("log");

function log(message) {
  logBox.innerHTML += "<br>" + message;
  console.log(message);
}


// ------------------------------------
// 1. JavaScript自体が動いているか
// ------------------------------------

logBox.innerHTML = "① JavaScript 起動 OK";


// ------------------------------------
// 2. URLからVideo ID取得
// ------------------------------------

const params =
  new URLSearchParams(
    window.location.search
  );

const videoId =
  params.get("v")
  || "M7lc1UVf-VE";

log("② Video ID: " + videoId);


// ------------------------------------
// 3. ブラウザ機能の確認
// ------------------------------------

log(
  "③ postMessage: "
  + (typeof window.postMessage)
);

log(
  "④ UserAgent: "
  + navigator.userAgent
);


// ------------------------------------
// 4. IFrame API読み込み開始
// ------------------------------------

log("⑤ IFrame API 読込開始");

const tag =
  document.createElement("script");

tag.src =
  "https://www.youtube.com/iframe_api";

tag.onload = function() {
  log("⑥ iframe_api.js 読込成功");
};

tag.onerror = function() {
  log("❌ iframe_api.js 読込失敗");
};

document.head.appendChild(tag);


// ------------------------------------
// 5. YouTube API準備完了
// ------------------------------------

let player = null;

function onYouTubeIframeAPIReady() {

  log("⑦ onYouTubeIframeAPIReady 発火");

  try {

    player = new YT.Player(
      "player",
      {
        width: "200",
        height: "200",

        videoId: videoId,

        playerVars: {
          playsinline: 1,
          controls: 1,
          autoplay: 0,
          rel: 0
        },

        events: {

          onReady:
            function(event) {

              log(
                "✅ ⑧ Player Ready"
              );
            },


          onStateChange:
            function(event) {

              log(
                "STATE: "
                + event.data
              );
            },


          onError:
            function(event) {

              log(
                "❌ YouTube Error: "
                + event.data
              );

              if (
                event.data === 2
              ) {

                log(
                  "→ 無効なパラメータ"
                );
              }

              if (
                event.data === 5
              ) {

                log(
                  "→ HTML5 Playerエラー"
                );
              }

              if (
                event.data === 100
              ) {

                log(
                  "→ 動画が存在しない/非公開"
                );
              }

              if (
                event.data === 101
                ||
                event.data === 150
              ) {

                log(
                  "→ 埋め込み再生禁止"
                );
              }

              if (
                event.data === 153
              ) {

                log(
                  "→ Referer/Client識別エラー"
                );
              }
          }
        }
      }
    );

    log(
      "⑦-B Player生成処理完了"
    );

  } catch (error) {

    log(
      "❌ Player生成例外: "
      + error
    );
  }
}


// ------------------------------------
// 6. 手動再生
// ------------------------------------

function manualPlay() {

  log(
    "▶ 再生ボタン押下"
  );

  if (!player) {

    log(
      "❌ player が未生成"
    );

    return;
  }

  try {

    player.playVideo();

    log(
      "playVideo() 呼び出し"
    );

  } catch (error) {

    log(
      "❌ playVideo例外: "
      + error
    );
  }
}


// ------------------------------------
// 7. 10秒後の状態確認
// ------------------------------------

setTimeout(
  function() {

    log(
      "⏱ 10秒経過"
    );

    log(
      "YT: "
      + typeof YT
    );

    log(
      "player: "
      + typeof player
    );

  },
  10000
);

</script>

</body>
</html>
