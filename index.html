<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>YouTube Watch Player</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #status {
            font-size: 11px;
            margin: 5px;
            text-align: center;
        }

        #playerContainer {
            width: 200px;
            height: 200px;
            overflow: hidden;
            background: #111;
        }

        iframe {
            width: 200px;
            height: 200px;
            border: 0;
        }

        #videoID {
            margin-top: 5px;
            font-size: 10px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div id="status">
        直接iframe方式
    </div>

    <div id="playerContainer"></div>

    <div id="videoID"></div>

    <script>
        const params = new URLSearchParams(
            window.location.search
        );

        const videoId =
            params.get("v") || "M7lc1UVf-VE";

        document.getElementById(
            "videoID"
        ).textContent =
            "ID: " + videoId;


        const iframe =
            document.createElement("iframe");


        iframe.src =
            "https://www.youtube.com/embed/"
            + encodeURIComponent(videoId)
            + "?playsinline=1"
            + "&controls=1"
            + "&autoplay=0"
            + "&rel=0";


        iframe.setAttribute(
            "allow",
            "autoplay; encrypted-media; picture-in-picture"
        );


        iframe.setAttribute(
            "allowfullscreen",
            ""
        );


        iframe.onload = function () {

            document.getElementById(
                "status"
            ).textContent =
                "iframe読み込み完了";
        };


        document.getElementById(
            "playerContainer"
        ).appendChild(
            iframe
        );
    </script>

</body>
</html>
